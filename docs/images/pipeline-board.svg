<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Pipeline board diagram with Saved, Applied, Screening, Interview and Offer columns">
  <rect width="900" height="280" fill="#fdf6e3"/>
  <text x="30" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#586e75">Pipeline board — illustrative diagram, no real applications</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g><rect x="30" y="50" width="160" height="180" rx="10" fill="#eee8d5"/><text x="45" y="75" font-size="14" font-weight="700" fill="#657b83">Saved</text><rect x="45" y="85" width="130" height="60" rx="8" fill="#fdf6e3"/><text x="55" y="105" font-size="12" fill="#586e75">Example role</text><text x="55" y="122" font-size="11" fill="#93a1a1">Example Company</text><text x="55" y="138" font-size="11" fill="#b58900">Next: Apply today</text></g>
    <g><rect x="200" y="50" width="160" height="180" rx="10" fill="#eee8d5"/><text x="215" y="75" font-size="14" font-weight="700" fill="#657b83">Applied</text><rect x="215" y="85" width="130" height="60" rx="8" fill="#fdf6e3"/><text x="225" y="105" font-size="12" fill="#586e75">Example role</text><text x="225" y="122" font-size="11" fill="#93a1a1">Example Company</text><text x="225" y="138" font-size="11" fill="#268bd2">Next: Follow up</text></g>
    <g><rect x="370" y="50" width="160" height="180" rx="10" fill="#eee8d5"/><text x="385" y="75" font-size="14" font-weight="700" fill="#657b83">Screening</text><rect x="385" y="85" width="130" height="60" rx="8" fill="#fdf6e3"/><text x="395" y="105" font-size="12" fill="#586e75">Example role</text><text x="395" y="122" font-size="11" fill="#93a1a1">Example Company</text><text x="395" y="138" font-size="11" fill="#b58900">Next: Prepare</text></g>
    <g><rect x="540" y="50" width="160" height="180" rx="10" fill="#eee8d5"/><text x="555" y="75" font-size="14" font-weight="700" fill="#657b83">Interview</text><rect x="555" y="85" width="130" height="60" rx="8" fill="#fdf6e3"/><text x="565" y="105" font-size="12" fill="#586e75">Example role</text><text x="565" y="122" font-size="11" fill="#93a1a1">Example Company</text><text x="565" y="138" font-size="11" fill="#cb4b16">Next: Interview prep</text></g>
    <g><rect x="710" y="50" width="160" height="180" rx="10" fill="#eee8d5"/><text x="725" y="75" font-size="14" font-weight="700" fill="#657b83">Offer</text><rect x="725" y="85" width="130" height="60" rx="8" fill="#fdf6e3"/><text x="735" y="105" font-size="12" fill="#586e75">Example role</text><text x="735" y="122" font-size="11" fill="#93a1a1">Example Company</text><text x="735" y="138" font-size="11" fill="#859900">Next: Review offer</text></g>
  </g>
  <text x="30" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#93a1a1">Drag a card between columns to change its stage. Rejected and Withdrawn are also drop targets while dragging.</text>
</svg>
