<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Solarized Light palette used by the tracker">
  <rect width="900" height="200" fill="#fdf6e3"/>
  <text x="30" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#586e75">Solarized Light — tracker theme</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">
    <g><rect x="30" y="50" width="100" height="70" rx="8" fill="#fdf6e3" stroke="#93a1a1"/><text x="80" y="140" fill="#657b83">#fdf6e3 base3</text><text x="80" y="156" fill="#93a1a1">background</text></g>
    <g><rect x="145" y="50" width="100" height="70" rx="8" fill="#eee8d5" stroke="#93a1a1"/><text x="195" y="140" fill="#657b83">#eee8d5 base2</text><text x="195" y="156" fill="#93a1a1">panels / cards</text></g>
    <g><rect x="260" y="50" width="100" height="70" rx="8" fill="#93a1a1"/><text x="310" y="140" fill="#657b83">#93a1a1 base1</text><text x="310" y="156" fill="#93a1a1">muted text</text></g>
    <g><rect x="375" y="50" width="100" height="70" rx="8" fill="#657b83"/><text x="425" y="140" fill="#657b83">#657b83 base00</text><text x="425" y="156" fill="#93a1a1">main text</text></g>
    <g><rect x="490" y="50" width="100" height="70" rx="8" fill="#586e75"/><text x="540" y="140" fill="#657b83">#586e75 base01</text><text x="540" y="156" fill="#93a1a1">headings</text></g>
    <g><rect x="605" y="50" width="100" height="70" rx="8" fill="#268bd2"/><text x="655" y="140" fill="#657b83">#268bd2 blue</text><text x="655" y="156" fill="#93a1a1">Applied</text></g>
    <g><rect x="720" y="50" width="100" height="70" rx="8" fill="#859900"/><text x="770" y="140" fill="#657b83">#859900 green</text><text x="770" y="156" fill="#93a1a1">Offer</text></g>
  </g>
  <text x="30" y="185" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#93a1a1">Other accents: yellow #b58900, orange #cb4b16, red #dc322f, magenta #d33682, violet #6c71c4, cyan #2aa198.</text>
</svg>
